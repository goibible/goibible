name: Bible integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  canonical-release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tracked Python syntax
        run: python3 -m py_compile tools/translation_pipeline/*.py tools/build_reader_db.py
      - name: Verify preserved source manifests
        run: python3 tools/translation_pipeline/verify_scaffold_manifests.py
      - name: Require cross-language retro-check receipts
        run: python3 tools/translation_pipeline/verify_cross_language_audit.py
      - name: Require an audit entry for changed active translations
        if: github.event_name == 'pull_request'
        run: python3 tools/translation_pipeline/verify_changed_translation_audit.py --base "${{ github.event.pull_request.base.sha }}"
      - name: Require an audit entry for active translations pushed to main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 tools/translation_pipeline/verify_changed_translation_audit.py --base "${{ github.event.before }}"
      - name: Verify flatfiles, download DBs, and manifest parity
        run: python3 tools/translation_pipeline/verify_release_integrity.py
