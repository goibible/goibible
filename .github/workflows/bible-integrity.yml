name: Bible integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  canonical-release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tracked Python syntax
        run: python3 -m py_compile tools/translation_pipeline/*.py tools/build_reader_db.py
      - name: Work out which editions this change touches
        id: eds
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          echo "list=$(python3 tools/translation_pipeline/changed_editions.py "$BASE")" >> "$GITHUB_OUTPUT"
      - name: Per-edition gates (each edition stands on its own)
        run: |
          for E in ${{ steps.eds.outputs.list }}; do
            echo "== $E"
            python3 tools/translation_pipeline/verify_scaffold_manifests.py --edition "$E"
            python3 tools/translation_pipeline/verify_cross_language_audit.py --edition "$E"
            python3 tools/translation_pipeline/verify_release_integrity.py --edition "$E"
          done
      - name: Overview of all editions (informational, never blocks)
        continue-on-error: true
        run: |
          python3 tools/translation_pipeline/verify_scaffold_manifests.py
          python3 tools/translation_pipeline/verify_cross_language_audit.py
          python3 tools/translation_pipeline/verify_release_integrity.py
      - name: Changed-verse ledger coverage (informational, bulk audits touch thousands of verses)
        continue-on-error: true
        if: github.event_name == 'pull_request'
        run: python3 tools/translation_pipeline/verify_changed_translation_audit.py --base "${{ github.event.pull_request.base.sha }}"
      - name: Changed-verse ledger coverage on main (informational)
        continue-on-error: true
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 tools/translation_pipeline/verify_changed_translation_audit.py --base "${{ github.event.before }}"
