# XcodeGen spec (CI / any Mac): one shared source tree -> iOS app (iPhone + iPad) and native macOS app.
# Linux day-to-day builds use xtool + Package.swift instead; both read the same Sources/.
name: GOIBible
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.goibible.reader
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targetTemplates:
  App:
    type: application
    sources:
      - path: Sources/GOIBible
        excludes: ["Resources", "Resources/**"]
      - path: Sources/GOIBible/Resources
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    info:
      path: .xcodegen/Info-${target_name}.plist
      properties:
        CFBundleDisplayName: GOIBible
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        LSApplicationCategoryType: public.app-category.reference
targets:
  GOIBible_iOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: GOIBible
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
  GOIBible_macOS:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: GOIBible
